[project]
name = "appsec-triage"
version = "0.1.0"
description = "LLM triage for SAST and SCA findings: closes what a fact closes, and says why"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
appsec-triage = "appsec_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["appsec_triage*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.setuptools.package-data]
"appsec_triage.sca.lang" = ["builtins/*.txt"]
