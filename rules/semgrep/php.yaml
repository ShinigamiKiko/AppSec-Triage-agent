# PHP-правила. Ни bandit, ни codeql PHP не покрывают — для PHP это основной слой.
# Ориентировано на Symfony/Doctrine, потому что типовой российский бэкенд именно такой.
#
# Правила намеренно ловят с запасом: отсев ложных срабатываний — работа триажа,
# а не сканера. Источником пользовательского ввода в Symfony считаются
# $request->get()/query/request/attributes, $_GET/$_POST/$_REQUEST/$_COOKIE.

rules:
  # --- инъекции ----------------------------------------------------------
  - id: php-sql-concatenation
    languages: [php]
    severity: ERROR
    message: >-
      SQL built by concatenation or interpolation. Check whether any interpolated
      part reaches this from a request.
    metadata:
      cwe: "CWE-89: SQL Injection"
      category: security
    pattern-either:
      - pattern-regex: (?i)->(query|exec|prepare)\s*\(\s*["'][^"']*\$
      - pattern-regex: (?i)(SELECT|INSERT|UPDATE|DELETE)\s[^;"']*["']\s*\.\s*\$
      - pattern-regex: (?i)createQuery\s*\(\s*["'][^"']*\$
      - pattern-regex: (?i)->where\s*\(\s*["'][^"']*\.\s*\$
      # PHP interpolates variables inside DOUBLE-quoted strings, so its most
      # common SQL injection carries no concatenation operator at all:
      #     $q = "SELECT ... WHERE user_id = '$id';"
      # Requiring `.` or `+` missed every SQLi in DVWA. Single-quoted strings do
      # not interpolate, so this pattern is deliberately double-quote only.
      - pattern-regex: '"[^"]*\b(?i:SELECT|INSERT|UPDATE|DELETE)\b[^"]*(\$\w+|\{\$)[^"]*"'

  - id: php-doctrine-raw-sql
    languages: [php]
    severity: WARNING
    message: >-
      Raw SQL through the Doctrine connection. Safe only with bound parameters —
      confirm nothing is interpolated into the string.
    metadata:
      cwe: "CWE-89: SQL Injection"
      category: security
    pattern-either:
      - pattern: $CONN->executeQuery($SQL, ...)
      - pattern: $CONN->executeStatement($SQL, ...)
      - pattern: $CONN->fetchAllAssociative($SQL, ...)
      - pattern: $EM->createNativeQuery(...)

  - id: php-command-execution
    languages: [php]
    severity: ERROR
    message: >-
      Shell command execution. If any part of the command comes from a request,
      this is remote code execution.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      category: security
    pattern-either:
      - pattern: exec(...)
      - pattern: shell_exec(...)
      - pattern: system(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
      - pattern-regex: \$\{?\w+\}?\s*=\s*`[^`]*`

  - id: php-code-evaluation
    languages: [php]
    severity: ERROR
    message: Dynamic code evaluation. Almost never justifiable in application code.
    metadata:
      cwe: "CWE-95: Eval Injection"
      category: security
    pattern-either:
      - pattern: eval(...)
      - pattern: assert($X)
      - pattern: create_function(...)
      - pattern: preg_replace("/.../e", ...)

  - id: php-dynamic-include
    languages: [php]
    severity: ERROR
    message: >-
      File inclusion with a variable path — local/remote file inclusion if the
      value is attacker-controlled.
    metadata:
      cwe: "CWE-98: PHP Remote File Inclusion"
      category: security
    # Границы слова с ОБЕИХ сторон обязательны: без замыкающей `\b` это правило
    # ловило `required`, `requirements`, `requiresSQLCommentHint` — 77 мусорных
    # находок из 296 на реальном проекте, четверть всего выхлопа. Плюс запрет на
    # перенос строки, иначе `[^;'"]*` доедает до `$` в следующем выражении.
    pattern-regex: (?i)\b(include|include_once|require|require_once)\b\s*\(?\s*[^;'"\n]*\$

  - id: php-unserialize-untrusted
    languages: [php]
    severity: ERROR
    message: >-
      unserialize() on non-constant input allows object injection and, with a
      gadget chain, remote code execution. Prefer json_decode().
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      category: security
    pattern-either:
      - pattern: unserialize($X)
      - pattern: yaml_parse($X)

  # --- XSS ----------------------------------------------------------------
  - id: php-echo-request-value
    languages: [php]
    severity: ERROR
    message: Request value echoed without escaping.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      category: security
    pattern-either:
      - pattern-regex: (?i)\b(echo|print)\s+[^;]*\$_(GET|POST|REQUEST|COOKIE)
      - pattern-regex: (?i)\b(echo|print)\s+[^;]*\$request->(get|query|request)
      - pattern-regex: (?i)printf\s*\([^)]*\$_(GET|POST|REQUEST)
      # Request input concatenated into a buffer that is echoed later. DVWA's
      # reflected XSS is exactly this shape, and the `echo` patterns miss it:
      #     $html .= '<pre>Hello ' . $_GET[ 'name' ] . '</pre>';
      - pattern-regex: (?i)\$\w*(html|output|page|content|body|markup)\w*\s*\.?=[^;]*\$_(GET|POST|REQUEST|COOKIE)
      - pattern-regex: (?i)\$\w*(html|output|page|content|body|markup)\w*\s*\.?=[^;]*\$request->(get|query|request)
      # Request input landing between HTML tags in any string expression.
      - pattern-regex: (?i)["'][^"']*<\w+[^"']*["']\s*\.\s*\$_(GET|POST|REQUEST|COOKIE)

  - id: php-twig-raw-filter
    languages: [generic]
    severity: WARNING
    message: >-
      Twig auto-escaping bypassed with |raw. Confirm the value cannot contain
      user-controlled markup.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      category: security
    paths:
      include: ["*.twig", "*.html.twig"]
    pattern-regex: \{\{[^}]*\|\s*raw[^}]*\}\}

  - id: php-response-without-escaping
    languages: [php]
    severity: WARNING
    message: HTML response assembled from variables. Verify each interpolation is escaped.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      category: security
    pattern-either:
      - pattern: new Response("...".$X, ...)
      - pattern-regex: new\s+Response\s*\(\s*["'][^"']*<[^"']*["']\s*\.\s*\$

  # --- транспорт и крипта ---------------------------------------------------
  - id: php-tls-verification-disabled
    languages: [generic]
    severity: ERROR
    message: >-
      TLS verification disabled. Exploitable by any attacker on the network path,
      regardless of whether the URL is a constant.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      category: security
    pattern-regex: >-
      (?i)(CURLOPT_SSL_VERIFYPEER\s*(?:,|=>)\s*(?:false|0)|CURLOPT_SSL_VERIFYHOST\s*(?:,|=>)\s*0|["']verify_peer["']\s*=>\s*false|["']verify["']\s*=>\s*false|allow_self_signed["']\s*=>\s*true)

  - id: php-weak-hash-for-secret
    languages: [php]
    severity: WARNING
    message: >-
      Weak hash. A finding when it protects a password or a signature; harmless
      as a cache key or an ETag — check the use.
    metadata:
      cwe: "CWE-327: Broken Cryptographic Algorithm"
      category: security
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
      - pattern: crypt($X)
      - pattern-regex: hash\s*\(\s*["'](md5|sha1)["']

  - id: php-weak-randomness
    languages: [php]
    severity: WARNING
    message: >-
      Non-cryptographic randomness. A vulnerability only when the value guards
      something — token, session id, password reset, nonce.
    metadata:
      cwe: "CWE-330: Use of Insufficiently Random Values"
      category: security
    pattern-either:
      - pattern: rand(...)
      - pattern: mt_rand(...)
      - pattern: uniqid(...)
      - pattern: shuffle(...)
      - pattern: str_shuffle(...)

  # --- прочее ---------------------------------------------------------------
  - id: php-xxe-entity-loading
    languages: [php]
    severity: ERROR
    message: XML parsed with external entities enabled.
    metadata:
      cwe: "CWE-611: XML External Entity Reference"
      category: security
    pattern-either:
      - pattern: libxml_disable_entity_loader(false)
      - pattern-regex: LIBXML_NOENT
      - pattern-regex: simplexml_load_(string|file)\s*\([^)]*LIBXML_(NOENT|DTDLOAD)

  - id: php-ssrf-user-controlled-url
    languages: [php]
    severity: ERROR
    message: >-
      Outbound request to a variable URL. If the value comes from a request this
      is SSRF — check what the URL is built from.
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery"
      category: security
    pattern-either:
      - pattern: curl_setopt($CH, CURLOPT_URL, $URL)
      - pattern: file_get_contents($URL)
      - pattern-regex: ->request\s*\(\s*['"](GET|POST)['"]\s*,\s*\$

  - id: php-path-traversal
    languages: [php]
    severity: ERROR
    message: Filesystem path built from a request value.
    metadata:
      cwe: "CWE-22: Path Traversal"
      category: security
    pattern-regex: >-
      (?i)(file_get_contents|file_put_contents|fopen|unlink|readfile|copy|rename)\s*\([^)]*\$_(GET|POST|REQUEST|COOKIE)

  - id: php-debug-enabled-in-config
    languages: [generic]
    severity: WARNING
    message: Debug or profiler left enabled. Verify this is not the production config.
    metadata:
      cwe: "CWE-489: Active Debug Code"
      category: security
    paths:
      include: ["*.yaml", "*.yml", "*.env*", "*.ini"]
    pattern-regex: (?i)^\s*(APP_DEBUG|debug|profiler)\s*[:=]\s*(true|1)\s*$

  - id: php-permissive-cors
    languages: [generic]
    severity: WARNING
    message: >-
      Wildcard CORS origin. Combined with credentials this exposes authenticated
      endpoints to any site.
    metadata:
      cwe: "CWE-942: Permissive Cross-domain Policy"
      category: security
    pattern-regex: (?i)Access-Control-Allow-Origin["']?\s*[,:=>]+\s*["']\*["']

  # --- подпись и сравнение секретов ----------------------------------------
  # Найдено при ручном разборе очереди на реальном проекте: сканер показал
  # только слабый sha1, а настоящих проблем в той строке было две.
  - id: php-timing-unsafe-secret-comparison
    languages: [php]
    severity: ERROR
    message: >-
      Signature or digest compared with == / ===, which returns on the first
      differing byte. That timing difference lets an attacker recover the
      expected value byte by byte. Use hash_equals().
    metadata:
      cwe: "CWE-208: Observable Timing Discrepancy"
      category: security
    pattern-regex: >-
      (?i)\$\w*(sign|signature|token|hmac|mac|digest|hash|checksum|secret)\w*\s*={2,3}\s*(sha1|md5|hash|hash_hmac|crypt)\s*\(

  - id: php-homebrew-mac
    languages: [php]
    severity: ERROR
    message: >-
      Message authentication built by hashing data concatenated with a key.
      A homebrew MAC — use hash_hmac() with SHA-256 or better. On a broken hash
      such as SHA-1 a collision forges a valid signature without the key.
    metadata:
      cwe: "CWE-327: Broken Cryptographic Algorithm"
      category: security
    pattern-regex: >-
      (?i)(sha1|md5)\s*\(\s*(sprintf\s*\([^)]*\$\w*(key|secret|salt)|[^)]*\.\s*\$\w*(key|secret|salt))
