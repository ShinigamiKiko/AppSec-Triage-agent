# Секреты. Офлайн, без обращения к semgrep.dev.
#
# Semgrep не даёт смешивать `generic` с реальными языками в одном правиле, и
# AST-паттерн вида `$NAME = "..."` валиден не во всех языках сразу. Поэтому
# разделение жёсткое: regex-правила — `generic`, AST-паттерны — по языкам.

rules:
  - id: known-credential-format
    languages: [generic]
    severity: ERROR
    message: >-
      Literal matches a recognizable live-credential format. A key in this shape
      is a finding even inside a test file.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    pattern-regex: >-
      (AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{32,}|-----BEGIN\s(?:RSA\s|EC\s|OPENSSH\s)?PRIVATE\sKEY-----)

  - id: credential-named-assignment
    languages: [generic]
    severity: WARNING
    message: >-
      Credential-looking name assigned a string literal. Decide from the value:
      a template placeholder is noise, a high-entropy literal is not.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    pattern-regex: >-
      (?i)\b\w*(passwd|password|secret|token|api[_-]?key|apikey|private[_-]?key|credential|passphrase)\w*\s*(?::=|=>|=|:)\s*["'][^"'\n]{4,}["']

  - id: default-password-in-config
    languages: [generic]
    severity: WARNING
    message: Default or placeholder credential in a configuration value.
    metadata:
      cwe: "CWE-259: Use of Hard-coded Password"
      category: security
    paths:
      include: ["*.yml", "*.yaml", "*.properties", "*.ini", "*.env", "*.conf", "*.toml"]
    # Two defects this shape used to have, both measured on a real .env:
    #
    #  * the credential word had to end the name. `JWT_ATS_SECRET_KEY=` was not
    #    matched, because `_KEY` follows `SECRET` — so the trailing `[\w.\-]*`
    #    is load-bearing, not decoration.
    #  * the vocabulary was too narrow. `ATS_SIGN_KEY`, `LEADS_SIGN_KEY` and
    #    `S3_ACCESS_SECRET` name HMAC and storage keys and matched nothing.
    #
    # Seven live-looking keys in one committed file went unreported because of
    # these two, and triage cannot judge what the scanner never sends it.
    pattern-regex: >-
      (?i)^[ \t]*[\w.\-]*(passwd|password|secret|token|api[_.-]?key|sign[_.-]?key|access[_.-]?key|private[_.-]?key|client[_.-]?(secret|id)|credential|passphrase)[\w.\-]*\s*[:=]\s*\S+

  - id: connection-string-with-password
    languages: [generic]
    severity: ERROR
    message: Connection string carrying an inline password.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    pattern-regex: >-
      (?i)(postgres|postgresql|mysql|mongodb|redis|amqp|mssql)://[^\s:'"]+:[^\s@'"]{3,}@

  - id: high-entropy-value-in-config
    languages: [generic]
    severity: WARNING
    message: >-
      A long, random-looking value in a configuration file. The name says
      nothing, so the value decides: judge whether it is a live credential and
      whether this file is published.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    paths:
      include: ["*.env", ".env*", "*.yml", "*.yaml", "*.properties", "*.ini", "*.toml", "*.conf"]
    # Names give a scanner nothing here — `HH_CLIENT_ID` held a 64-character
    # OAuth token and `AVITO_SCOPES` holds a comma-separated word list. So this
    # matches on the *value*: 24+ characters of key alphabet, anchored to the
    # whole value so URLs, paths and lists (which carry `/`, `:`, `,`) do not
    # match. Entropy is judged downstream — heuristics already score it, and
    # the triage prompt asks whether the value is live.
    pattern-regex: (?i)^[ \t]*[\w.\-]+[ \t]*[:=][ \t]*["']?[A-Za-z0-9+/_-]{24,}={0,2}["']?[ \t]*$
