# ВНИМАНИЕ: внешний API (CN-юрисдикция). Те же ограничения, что у openai.yaml,
# плюс отдельная оценка комплаенса перед прогоном по внутреннему коду.
kind: deepseek
model: ${DEEPSEEK_MODEL:-deepseek-chat}
base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
api_key: ${DEEPSEEK_API_KEY}

temperature: 0.0
max_tokens: 2200          # вердикт с трассой и обоснованием; на 1400 бывали обрывы

# json_schema не поддерживается — только json_object, и слово "json"
# обязано присутствовать в промпте, иначе пустой ответ. Клиент это дошивает сам.
json_mode: json_object

# Ответы заметно медленнее OpenAI, особенно на reasoner-моделях.
timeout_s: 120
connect_timeout_s: 10
max_retries: 3
backoff_base_s: 1.5
backoff_max_s: 30.0

concurrency: 8            # запросы ждут сеть, а не GPU; Psalm и CodeQL стоят в своей очереди

pricing:
  input_usd_per_mtok: 0.28
  output_usd_per_mtok: 0.42

options: {}
