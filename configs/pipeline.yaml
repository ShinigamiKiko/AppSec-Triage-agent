# Общие настройки пайплайна. Провайдер-специфика — в configs/providers/*.yaml.

# Осознанный выбор, а не удобство: DeepSeek — внешний API, и прогон по коду из
# Rabota означает, что фрагменты исходников и пути файлов уходят за периметр.
# Решение принято владельцем кода. Локальный контур остаётся доступен: `-p ollama`.
#
# Основание — замер на procim (82 находки): на SAST обе модели совпали 21 из 21,
# а расхождения были только в SCA, где локальная модель писала верное
# обоснование и ставила метку `unknown`. Это дисциплина формата, а не глубина
# рассуждения, — но на настройке промптов она стоит времени.
provider: deepseek
prompt_pack: default
max_workers: 4            # ограничивается сверху provider.concurrency
fail_fast: false          # false: сбой одного finding не роняет прогон

# Сколько кода уезжает в промпт. Больше контекста != лучше: шум роняет качество.
code_context_lines: 6
max_code_chars: 4000
max_trace_steps: 12

# Второй, состязательный проход по отдельным вердиктам.
# Не переголосование: на один и тот же вопрос модель дважды даёт один и тот же
# ответ вместе с той же ошибкой — её ошибки систематические, а не случайные.
# Второй проход спрашивает другое: «что не так с этим вердиктом».
verification:
  enabled: true
  # advisory: контраргумент идёт в бриф ревьюеру, вердикт не меняет.
  # Замерено: authoritative срезал верные вердикты с 20 до 17 при нулевых
  # пропусках в обоих режимах. Возражение стоит прочитать, но не слушаться.
  mode: advisory
  # Точность `confirmed` — измеренное слабое место (0 из 5 на реальном коде).
  challenge_verdicts: [confirmed]
  # Проход стоит как первый, поэтому не на всё подряд. Включи, если готов
  # платить временем за перепроверку всего, что правил post-validation.
  challenge_on_override: false
  challenge_cwes: []
  # Опасный пропуск живёт в ЗАКРЫТИИ, а не в подтверждении. Перепроверяем
  # закрытия на классах, где ошибка дорого стоит. Порог — вес последствия из
  # consequence.py: 30 RCE, 26 SQLi/authn, 24 секреты/SSRF, 20 TLS, 14 крипта.
  # 26 = «high и крит». Дорого на первом прогоне (+~57%), дальше --reuse
  # оставляет вторые проходы только на изменившемся.
  challenge_closures_above_consequence: 26

# Очередь на ручной разбор: приоритизация, кластеризация, бюджет.
# Отложенные позиции не исчезают — они остаются в отчёте и в аудите.
queue:
  enabled: true
  # Доля находок, которую человек реально готов просмотреть. Это ПОТОЛОК,
  # а не план: свободный бюджет не добивается тем, что триаж уже закрыл.
  # 20, не 30. Замер на трёх проектах: очередь упиралась в потолок во всех трёх
  # (26%, 26%, 29%), то есть цифру задавал бюджет, а не качество триажа. Снижение
  # потолка — это требование к приоритизации: то, что не влезло, не исчезает, а
  # уходит в отложенные и остаётся в отчёте.
  # 100 — потому что решения теперь принимаются в ASOC, а не здесь. Бюджет
  # существовал, чтобы не заваливать человека; когда очередь уезжает в систему,
  # которая сама умеет копить и закрывать, откладывание на нашей стороне только
  # прячет находки от неё. Вернуть 20 стоит, если отчёт снова начнут читать
  # глазами — тогда потолок опять полезен.
  review_budget_pct: 100
  # Схлопывать одинаковые паттерны в одно решение. Самый сильный рычаг:
  # 59 срабатываний одного правила — это одно решение, а не 59.
  cluster: true
  # Ниже этого балла позиция откладывается, даже если бюджет не выбран.
  # 0 — по той же причине: отложенное всё равно попадёт в ASOC, и лучше пусть
  # оно попадёт туда с вердиктом и брифом, чем тихо осядет в отложенных.
  min_score: 0

# Что вообще не идёт в триаж. Детерминированная политика, не суждение модели.
# Исключённые находки НЕ исчезают: они попадают в аудит с decided_by=scope и
# считаются пофайлово в summary. Фильтр, которого не видно, — дыра.
scope:
  enabled: true
  exclude_rules: []
    # Здесь пусто не случайно: bandit отключён (см. _LANG_SCANNERS в cli.py),
    # а все прежние исключения были про его шум — 31074 «в коде есть assert»,
    # `import subprocess`, `except: pass`. Правило-исключение переживает свою
    # причину и потом молча режет находки, поэтому они убраны вместе с ним.
  exclude_paths: []
  only_cwes: []          # напр. [CWE-798, CWE-259] чтобы гонять только секреты
  min_severity: null     # напр. medium

heuristics:
  enabled: true
  # true = очевидный мусор закрывается регулярками, не доходя до модели.
  # Экономит деньги, но убирает решение из-под аудита LLM — включай осознанно.
  autoclose_on_hard_fp: false
  min_secret_entropy: 3.5
  min_secret_length: 16
  noisy_path_patterns: []      # пусто = дефолтный список в heuristics.py
  placeholder_markers: []

post_validation:
  enabled: true
  # Для input-driven SAST решение требует обе половины: scanner trace source→sink
  # и production entrypoint от LSP/routes. Без одной из них verdict → unknown.
  require_sast_reachability: true
  require_evidence_quotes: true
  quote_match_threshold: 0.85  # ниже — начнут проскакивать перефразы
  confidence_floor: 0.7
  confirmed_confidence_floor: 0.75   # confirmed стоит дороже ошибки, планка выше
  escalate_severities: [critical, high]
  # На тяжёлом классе «выглядит нормально» — не вердикт. Чтобы закрыть, модель
  # обязана назвать и процитировать защиту: санитайзер, идентификатор, тестовую
  # заглушку. Необъяснённое закрытие становится unknown — машинный эквивалент
  # «не уверен, не отвечаю».
  closure_requires_named_defence_above: 26
