provider: deepseek
prompt_pack: default
max_workers: 8
fail_fast: false

code_context_lines: 6
max_code_chars: 4000
max_trace_steps: 12
max_evidence_chars: 32000
context_retrieval_rounds: 2
code_walk_first: true
max_tool_calls: 20
build_untrusted_input: false
parallel_llm: 2
slow_finding_seconds: 900
resolve_vulnerable_symbols: true

verification:
  enabled: true
  mode: advisory
  challenge_verdicts: [confirmed]
  challenge_on_override: false
  challenge_cwes: []
  challenge_closures_above_consequence: 26
  challenge_kinds: [weakness]
  downgrade_confirmed: true

queue:
  enabled: true
  review_budget_pct: 100
  cluster: true
  min_score: 0
  auto_decide_target_pct: 70

scope:
  enabled: true
  exclude_rules: []
  exclude_paths: []
  only_cwes: []
  min_severity: null
  only_ecosystems: [go, npm, composer]

heuristics:
  enabled: true
  autoclose_on_hard_fp: false
  min_secret_entropy: 3.5
  min_secret_length: 16
  noisy_path_patterns: []
  placeholder_markers: []

post_validation:
  enabled: true
  require_evidence_quotes: true
  quote_match_threshold: 0.85
  confidence_floor: 0.7
  confirmed_confidence_floor: 0.75
  escalate_severities: [critical, high]
  closure_requires_named_defence_above: 26
