# PHP-only LSP profile. Используется для смешанных репозиториев (Laravel, Symfony+Vite),
# где typescript-language-server пытается проиндексировать весь node_modules и висит.
# Всё остальное — идентично lsp.yaml: phpactor обязателен, reachability включена.
# Запуск: --lsp-config configs/profiles/lsp-php-only.yaml

enabled: true
reachability: true
required_languages: [php]

max_definitions: 4
max_callers: 8

startup_timeout_s: 120
index_timeout_s: 90
request_timeout_s: 20

# Спецификация сервера — configs/lsp/php.yaml.
servers: [php]
