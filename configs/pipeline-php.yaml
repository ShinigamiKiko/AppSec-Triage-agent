provider: ollama
prompt_pack: default
max_workers: 4
fail_fast: false

code_context_lines: 6
max_code_chars: 4000
max_trace_steps: 12

verification:
  enabled: true
  mode: advisory
  challenge_verdicts: [confirmed]
  challenge_on_override: false
  challenge_cwes: []
  challenge_closures_above_consequence: 26

queue:
  enabled: true
  review_budget_pct: 10
  cluster: true
  min_score: 50

scope:
  enabled: true
  exclude_rules: ["B101 assert_used"]
  exclude_paths: []
  only_cwes: []
  min_severity: null

heuristics:
  enabled: true
  autoclose_on_hard_fp: false
  min_secret_entropy: 3.5
  min_secret_length: 16
  noisy_path_patterns: []
  placeholder_markers: []

post_validation:
  enabled: true
  require_evidence_quotes: true
  quote_match_threshold: 0.85
  confidence_floor: 0.7
  confirmed_confidence_floor: 0.75
  escalate_severities: [critical, high]
  closure_requires_named_defence_above: 26
