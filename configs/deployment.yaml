# Где это приложение работает. Влияет на приоритет и на несколько проверок,
# которые платформа берёт на себя. Сам факт ingress/куба НИКОГДА не закрывает
# поток данных. Отдельный verified compensating control ниже может дать
# `external_fp`, только если он покрывает конкретный CWE/route и не обходится.
#
# Заполняется по факту, а не по намерению: неверное «мы не смотрим в интернет»
# тише и дороже, чем лишняя позиция в очереди. Пустой файл — нормальное
# состояние, тогда секция просто не добавляется в промпт.

enabled: true

# Свободное описание — идёт в промпт как есть. Пишите то, что проверяемо.
description: >-
  Приложение работает в Kubernetes. Внешний трафик приходит только через
  ingress-контроллер, TLS терминируется на нём. Между сервисами — internal
  cluster network.

# Факты, на которые модели разрешено ссылаться. Каждый — либо true, либо
# отсутствует; «не знаю» выражается отсутствием ключа, а не false.
facts:
  # TLS терминируется на ингрессе, приложение слушает plaintext внутри кластера.
  tls_terminated_at_ingress: true
  # Наружу торчит только то, для чего заведён Ingress/Route.
  internet_exposure_via_ingress_only: true
  # Проверки живости делает kubelet, а не Dockerfile.
  liveness_probes_by_platform: true
  # Пользователь контейнера задан в podSecurityContext, а не в образе.
  # Ставьте true, только если это действительно так во всех манифестах.
  run_as_non_root_by_platform: false
  # Секреты подставляются из Secret/Vault на деплое и перекрывают значения из
  # закоммиченных .env. ВНИМАНИЕ: это не делает закоммиченный ключ безопасным —
  # он всё равно утёк, — но объясняет, почему значение в файле не боевое.
  secrets_injected_at_deploy: false

# Правила сканеров, которые платформа закрывает по существу. Только те, где
# проверка буквально не о приложении. Каждая запись обязана назвать факт выше,
# на котором она держится, — иначе это просто список исключений.
platform_handles:
  - rule: "DS-0026"          # No HEALTHCHECK defined
    requires: liveness_probes_by_platform
    why: "живость контейнера проверяет kubelet через livenessProbe, HEALTHCHECK в образе не используется"

# Внешние security controls. Не добавляйте сюда обычный LB/Ingress: маршрутизация
# не является защитой. `verified: true` означает, что policy проверена по
# манифесту/конфигу, `bypass_possible: false` — что pod/service нельзя вызвать
# в обход контроля. Пустое или неполное покрытие не может дать external_fp.
compensating_controls: []
  # - id: public-waf
  #   kind: waf
  #   direction: inbound
  #   covered_cwes: [CWE-79, CWE-89]
  #   covered_routes: ["/api/*"]  # ["*"] only for a verified global policy
  #   evidence: "WAF policy app-public blocks managed SQLi/XSS rules on /api/*"
  #   verified: true
  #   bypass_possible: false
  # - id: ldap-egress-policy
  #   kind: network_policy
  #   direction: outbound
  #   covered_cwes: [CWE-918]
  #   covered_paths: ["src/ldap/**"]
  #   evidence: "NetworkPolicy permits LDAP egress only through the validating proxy"
  #   verified: true
  #   bypass_possible: false
