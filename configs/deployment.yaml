enabled: true

description: >-
  Приложение работает в Kubernetes. Внешний трафик приходит только через
  ingress-контроллер, TLS терминируется на нём. Между сервисами — internal
  cluster network.

facts:
  tls_terminated_at_ingress: true
  internet_exposure_via_ingress_only: true
  liveness_probes_by_platform: true
  run_as_non_root_by_platform: false
  secrets_injected_at_deploy: false
  no_ssh_in_workloads: true
  host_platform_owned: true
  no_gui_or_hardware_in_workloads: true
  no_laravel_in_projects: true
  no_react_in_projects: true

out_of_scope_components:
  - id: ssh
    requires: no_ssh_in_workloads
    describe: >-
      Any use of SSH by the service itself, on either side: accepting SSH
      connections (sshd, golang.org/x/crypto/ssh NewServerConn or ServerConfig
      callbacks, an ssh2 Server, a paramiko ServerInterface), connecting out over
      SSH or SFTP (ssh.Dial, NewClientConn, an ssh2 Client, paramiko SSHClient),
      SSH agents as client or server, and SSH key, certificate and known_hosts
      handling. A flaw on the server side and a flaw on the client side both count.
    keywords: [ssh, sshd, sftp]
    markers: ["golang.org/x/crypto/ssh", "NewServerConn", "ssh2", "paramiko", "openssh", "sshd", "containerPort: 22"]
    why: "SSH в подах Kubernetes не используется ни сервером, ни клиентом — антипаттерн, доступ к контейнеру только через kubectl exec"
  - id: host_platform
    requires: host_platform_owned
    owner: platform-security
    describe: >-
      Host and node components: Linux kernel, kernel modules, eBPF, syscalls,
      device drivers, firmware, BIOS/UEFI, bootloaders, hypervisors, VM/container
      escape, systemd/udev, cgroups/namespaces, and the container runtime.
      These are attached to the machine or node, not to the application pod.
    keywords: [kernel, eBPF, syscall, firmware, BIOS, UEFI, bootloader, hypervisor, "VM escape", "container escape", systemd, udev, cgroup, namespace, runc, containerd, kubelet, etcd]
    markers: ["/proc/", "/sys/", "CAP_SYS_ADMIN", "privileged: true", "hostPID: true", "hostNetwork: true"]
    why: "уязвимость относится к машине, node или container runtime; это зона platform-security, а не приложения в pod"
  - id: laravel
    requires: no_laravel_in_projects
    describe: >-
      The Laravel framework and its Illuminate components: Laravel routing,
      Eloquent, Blade templates, the artisan console, the service container,
      queues and Horizon. Counts only when Laravel's own framework code is the
      sole path to the flaw. A flaw in a general-purpose library that merely
      mentions Laravel as one way to reach it does NOT count — that is a
      precondition to check, not a framework this platform does not run.
    keywords: [laravel, illuminate, blade, eloquent, artisan, horizon]
    markers: ["laravel/framework", "Illuminate\\", "laravel/", "artisan", "config/app.php", "Blade::"]
    why: "ни один сервис не написан на Laravel; уязвимость только во фреймворке Laravel к этим сервисам не относится"
  - id: react
    requires: no_react_in_projects
    describe: >-
      The React UI library and its immediate ecosystem: React DOM, React Native,
      the JSX runtime, React server components. Counts only when React's own
      rendering is the sole path to the flaw. A flaw in a general-purpose
      JavaScript library that happens to be popular with React does NOT count.
    keywords: [react, "react-dom", "react-native", jsx, preact]
    markers: ["\"react\":", "from 'react'", "from \"react\"", "react-dom", "ReactDOM", ".jsx", ".tsx"]
    why: "ни один сервис не рендерит React; уязвимость только в React к этим сервисам не относится"
  - id: gui_or_hardware
    requires: no_gui_or_hardware_in_workloads
    owner: platform-security
    describe: >-
      Desktop GUI and physical peripherals such as X11/Wayland, GTK/Qt,
      clipboard, printers, cameras, microphones, audio, and touchscreen are not
      present in the workload.
    keywords: [GUI, "graphical user interface", X11, Wayland, GTK, Qt, printer, CUPS, webcam, camera, microphone, audio, touchscreen]
    markers: [DISPLAY, WAYLAND_DISPLAY, /dev/video, /dev/snd, /dev/dri]
    why: "в pod нет desktop GUI и физических устройств; это не runtime приложения"

platform_handles:
  - rule: "DS-0026"
    requires: liveness_probes_by_platform
    why: "живость контейнера проверяет kubelet через livenessProbe, HEALTHCHECK в образе не используется"
