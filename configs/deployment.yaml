# Где это приложение работает. Влияет на приоритет и на несколько проверок,
# которые платформа берёт на себя, — но НИКОГДА не даёт права закрыть находку
# про поток данных. Инъекция остаётся инъекцией и за ингрессом.
#
# Заполняется по факту, а не по намерению: неверное «мы не смотрим в интернет»
# тише и дороже, чем лишняя позиция в очереди. Пустой файл — нормальное
# состояние, тогда секция просто не добавляется в промпт.

enabled: true

# Свободное описание — идёт в промпт как есть. Пишите то, что проверяемо.
description: >-
  Приложение работает в Kubernetes. Внешний трафик приходит только через
  ingress-контроллер, TLS терминируется на нём. Между сервисами — internal
  cluster network.

# Факты, на которые модели разрешено ссылаться. Каждый — либо true, либо
# отсутствует; «не знаю» выражается отсутствием ключа, а не false.
facts:
  # TLS терминируется на ингрессе, приложение слушает plaintext внутри кластера.
  tls_terminated_at_ingress: true
  # Наружу торчит только то, для чего заведён Ingress/Route.
  internet_exposure_via_ingress_only: true
  # Проверки живости делает kubelet, а не Dockerfile.
  liveness_probes_by_platform: true
  # Пользователь контейнера задан в podSecurityContext, а не в образе.
  # Ставьте true, только если это действительно так во всех манифестах.
  run_as_non_root_by_platform: false
  # Секреты подставляются из Secret/Vault на деплое и перекрывают значения из
  # закоммиченных .env. ВНИМАНИЕ: это не делает закоммиченный ключ безопасным —
  # он всё равно утёк, — но объясняет, почему значение в файле не боевое.
  secrets_injected_at_deploy: false
  # SSH в подах не используется ни в какой роли — ни сервер, ни клиент: доступ к
  # контейнеру только через kubectl exec. Решение владельца платформы: SSH внутри
  # сервиса — антипаттерн, SSH-уязвимости к сервисам не относятся.
  no_ssh_in_workloads: true
  # Host kernel, firmware, hypervisor and node/container runtime are owned by
  # the platform. These components are attached to the machine, not the pod.
  host_platform_owned: true
  # Workloads do not own desktop devices or host peripherals.
  no_gui_or_hardware_in_workloads: true
  # Фреймворки, на которых не написан ни один сервис. Ставьте true только за те,
  # в которых уверены: факт здесь закрывает находки. Соответствующая запись в
  # out_of_scope_components несёт markers — если фреймворк всё-таки окажется в
  # коде или образе, закрытие останется, но в отчёт уйдёт пометка с файлом и
  # строкой, и станет видно, что факт устарел.
  no_laravel_in_projects: true
  no_react_in_projects: true
  # Рабочая нагрузка — только Linux-контейнер. Уязвимости, существующие лишь на
  # Windows, macOS, BSD и мобильных ОС, к подам не относятся.
  linux_containers_only: true
  # Край HTTP принадлежит ingress: разбор границ запроса (request smuggling),
  # заголовки X-Forwarded-* и PROXY protocol настраивает его владелец, не сервис.
  http_edge_owned_by_ingress: true
  # FTP, Telnet, SMB/NFS и LDAP в сервисах не используются — ни как сервер, ни
  # как клиент.
  no_ftp_telnet_in_workloads: true
  no_smb_nfs_in_workloads: true
  no_ldap_in_workloads: true

  # --- Ниже выключено. Ставьте true только по факту: каждый факт закрывает CVE. ---
  # Ingress ходит к подам по HTTP/1.1; ни один сервис не принимает HTTP/2
  # (h2c, gRPC). Если есть хоть один gRPC-сервис — оставьте false.
  http1_only_to_backends: false
  # В подах нет локальных учётных записей и интерактивных сессий: второй
  # пользователь на той же машине и человек за терминалом здесь не существуют.
  no_local_users_in_workloads: false
  # В рабочих образах не запускаются dev-серверы, профилировщики, отладочные
  # панели и тест-раннеры.
  no_dev_tooling_in_production: false
  # Все БД, брокеры, кэши и хранилища, к которым подключаются сервисы, находятся
  # внутри кластера или управляются платформой: подставного сервера у клиента нет.
  backends_are_trusted: false
  # Фреймворки и продукты, на которых не написан ни один сервис.
  no_angular_in_projects: false
  no_nextjs_in_projects: false
  no_svelte_in_projects: false
  no_php_cms_in_projects: false
  no_electron_in_projects: false

# Компоненты, которых в сервисах платформы нет по решению её владельца. CVE,
# эксплуатируемая ТОЛЬКО через такой компонент, закрывается сразу — до поиска в
# коде и до CodeQL. Каждая запись называет факт выше; без факта запись не действует.
#   keywords — дешёвый фильтр: модель спрашивается, только если слово есть в advisory.
#   markers  — признаки, что компонент всё же есть в коде или образе: закрытие
#              остаётся, но в отчёт уходит пометка об антипаттерне с файлом и строкой.
out_of_scope_components:
  - id: ssh
    requires: no_ssh_in_workloads
    describe: >-
      Any use of SSH by the service itself, on either side: accepting SSH
      connections (sshd, golang.org/x/crypto/ssh NewServerConn or ServerConfig
      callbacks, an ssh2 Server, a paramiko ServerInterface), connecting out over
      SSH or SFTP (ssh.Dial, NewClientConn, an ssh2 Client, paramiko SSHClient),
      SSH agents as client or server, and SSH key, certificate and known_hosts
      handling. A flaw on the server side and a flaw on the client side both count.
    keywords: [ssh, sshd, sftp]
    markers: ["golang.org/x/crypto/ssh", "NewServerConn", "ssh2", "paramiko", "openssh", "sshd", "containerPort: 22"]
    why: "SSH в подах Kubernetes не используется ни сервером, ни клиентом — антипаттерн, доступ к контейнеру только через kubectl exec"
  - id: host_platform
    requires: host_platform_owned
    owner: platform-security
    describe: >-
      Host and node components: Linux kernel, kernel modules, eBPF, syscalls,
      device drivers, firmware, BIOS/UEFI, bootloaders, hypervisors, VM/container
      escape, systemd/udev, cgroups/namespaces, and the container runtime.
      These are attached to the machine or node, not to the application pod.
    keywords: [kernel, eBPF, syscall, firmware, BIOS, UEFI, bootloader, hypervisor, "VM escape", "container escape", systemd, udev, cgroup, namespace, runc, containerd, kubelet, etcd]
    markers: ["/proc/", "/sys/", "CAP_SYS_ADMIN", "privileged: true", "hostPID: true", "hostNetwork: true"]
    why: "уязвимость относится к машине, node или container runtime; это зона platform-security, а не приложения в pod"
  - id: laravel
    requires: no_laravel_in_projects
    describe: >-
      The Laravel framework and its Illuminate components: Laravel routing,
      Eloquent, Blade templates, the artisan console, the service container,
      queues and Horizon. Counts only when Laravel's own framework code is the
      sole path to the flaw. A flaw in a general-purpose library that merely
      mentions Laravel as one way to reach it does NOT count — that is a
      precondition to check, not a framework this platform does not run.
    keywords: [laravel, illuminate, blade, eloquent, artisan, horizon]
    markers: ["laravel/framework", "Illuminate\\", "laravel/", "artisan", "config/app.php", "Blade::"]
    why: "ни один сервис не написан на Laravel; уязвимость только во фреймворке Laravel к этим сервисам не относится"
  - id: react
    requires: no_react_in_projects
    describe: >-
      The React UI library and its immediate ecosystem: React DOM, React Native,
      the JSX runtime, React server components. Counts only when React's own
      rendering is the sole path to the flaw. A flaw in a general-purpose
      JavaScript library that happens to be popular with React does NOT count.
    keywords: [react, "react-dom", "react-native", jsx, preact]
    markers: ["\"react\":", "from 'react'", "from \"react\"", "react-dom", "ReactDOM", ".jsx", ".tsx"]
    why: "ни один сервис не рендерит React; уязвимость только в React к этим сервисам не относится"
  # Добавляя фреймворк сюда, добавьте и факт выше — без факта запись неактивна.
  # Шаблон: id, requires, describe (что именно считается этим фреймворком и что
  # НЕ считается), keywords (дешёвый префильтр по тексту advisory), markers
  # (признаки, что он всё же есть), why. Кандидаты, если они у вас не в ходу:
  # angular, vue, nuxt, next, django, flask, rails, wordpress, drupal, magento.
  - id: gui_or_hardware
    requires: no_gui_or_hardware_in_workloads
    owner: platform-security
    describe: >-
      Desktop GUI and physical peripherals such as X11/Wayland, GTK/Qt,
      clipboard, printers, cameras, microphones, audio, and touchscreen are not
      present in the workload.
    keywords: [GUI, "graphical user interface", X11, Wayland, GTK, Qt, printer, CUPS, webcam, camera, microphone, audio, touchscreen]
    markers: [DISPLAY, WAYLAND_DISPLAY, /dev/video, /dev/snd, /dev/dri]
    why: "в pod нет desktop GUI и физических устройств; это не runtime приложения"

  # ---- Платформа: Kubernetes и ingress ----------------------------------------
  # У записей ниже нет markers: компонент узнаётся по словам в самой CVE.
  - id: inbound_tls
    requires: tls_terminated_at_ingress
    owner: platform-security
    describe: >-
      TLS on a socket the service itself listens on: the server side of the TLS
      handshake, the listener's certificate and key, SNI and ALPN selection by a
      server, session tickets and resumption on the server, renegotiation, client
      certificate verification by a server, ACME / automatic certificate issuance.
      Does NOT cover TLS the service uses as a client: certificate or hostname
      verification of a server it connects to, and outgoing HTTPS, database or
      broker connections. A flaw that fires on both sides does NOT count.
    keywords: ["TLS server", "TLS handshake", ClientHello, SNI, ALPN, "session ticket", "session resumption", renegotiation, "client certificate", ACME, autocert]
    why: "TLS терминируется на ingress, сервис слушает plaintext; серверная сторона TLS — зона платформы"
  - id: inbound_http2
    requires: http1_only_to_backends
    owner: platform-security
    describe: >-
      The server side of HTTP/2 and HTTP/3: frame and stream handling by a server
      (rapid reset, RST_STREAM and CONTINUATION floods, SETTINGS and PING floods),
      HPACK / QPACK decoding by a server, h2c upgrade, QUIC listeners. Does NOT
      cover an HTTP/2 client talking to another server.
    keywords: ["HTTP/2", h2c, HPACK, "rapid reset", RST_STREAM, CONTINUATION, "SETTINGS frame", "HTTP/3", QUIC, QPACK]
    why: "ingress ходит к подам по HTTP/1.1; серверный HTTP/2 в сервисах не включён"
  - id: http_edge
    requires: http_edge_owned_by_ingress
    owner: platform-security
    describe: >-
      Behaviour that exists only between a front proxy and the backend behind it:
      HTTP request smuggling and desynchronisation (conflicting Content-Length and
      Transfer-Encoding, ambiguous chunking, header folding), trust in
      X-Forwarded-For / X-Forwarded-Host / X-Forwarded-Proto / Forwarded headers,
      the PROXY protocol, trusted-proxy lists. Does NOT cover a flaw in parsing a
      request body, a URL or a header value that needs no proxy in front to fire.
    keywords: ["request smuggling", desync, desynchronization, "Transfer-Encoding", "X-Forwarded-For", "X-Forwarded-Host", "X-Forwarded-Proto", "Forwarded header", "PROXY protocol", "trusted proxy", "reverse proxy"]
    why: "границу HTTP-запроса и forwarded-заголовки определяет настройка ingress, а не код сервиса"
  - id: cluster_services
    requires: host_platform_owned
    owner: platform-security
    describe: >-
      Kubernetes control-plane and cluster add-ons as running services:
      kube-apiserver, kube-controller-manager, kube-scheduler, kube-proxy, CoreDNS,
      CNI and CSI plugins, ingress controllers, admission controllers and
      webhooks, cert-manager, service-mesh proxies and sidecars (Istio, Envoy,
      Linkerd), Helm and kubectl as tools. Does NOT cover a Kubernetes client
      library that the service imports and calls.
    keywords: ["kube-apiserver", "kube-proxy", "kube-controller-manager", "kube-scheduler", CoreDNS, CNI, CSI, "ingress-nginx", "ingress controller", "admission controller", "admission webhook", "cert-manager", Istio, Envoy, Linkerd, Helm, kubectl]
    why: "компоненты кластера ведёт платформа; в поде приложения они не работают"
  - id: container_engine
    requires: host_platform_owned
    owner: platform-security
    describe: >-
      The container engine and image tooling as running software: the Docker
      daemon, Docker Engine API server, BuildKit, Moby, image build and image
      pull, registries, the Docker socket. Does NOT cover a Docker client or SDK
      that the service imports and calls.
    keywords: ["Docker daemon", dockerd, "Docker Engine", BuildKit, Moby, "docker.sock", "image pull", "docker build", "container registry"]
    why: "движок контейнеров и сборка образов — зона платформы и CI, не приложения в поде"

  # ---- Среда пода --------------------------------------------------------------
  - id: non_linux_os
    requires: linux_containers_only
    describe: >-
      A flaw that exists only on an operating system other than Linux: Windows
      (NTFS, UNC paths, drive letters, cmd.exe, PowerShell, the registry, DLL
      loading, Win32 APIs), macOS / Darwin, iOS, Android, FreeBSD, OpenBSD,
      NetBSD. Does NOT cover a flaw the advisory describes as cross-platform or
      as also affecting Linux, even when Windows is named as one more case.
    keywords: [Windows, macOS, Darwin, iOS, Android, FreeBSD, OpenBSD, NetBSD, NTFS, "UNC path", "cmd.exe", PowerShell, Win32]
    why: "сервисы работают только в Linux-контейнерах; уязвимость другой ОС к ним не относится"
  - id: local_multiuser
    requires: no_local_users_in_workloads
    owner: platform-security
    describe: >-
      An attack that needs another local account on the same machine: a local
      unprivileged user reading or replacing files of the process, a shared or
      world-writable temporary directory, symlink races set up by a local user,
      setuid binaries, PAM, sudo, polkit, cron jobs of other users, local
      privilege escalation. Does NOT cover a flaw triggered by a file or input
      that a remote party supplies — an upload, a request body, an archive the
      service unpacks.
    keywords: ["local user", "local attacker", "local privilege escalation", "unprivileged local", "other local users", "world-writable", "world-readable", setuid, "symlink attack", PAM, sudo, polkit, crontab]
    why: "в поде нет локальных учётных записей; второго пользователя на той же машине не существует"
  - id: interactive_terminal
    requires: no_local_users_in_workloads
    owner: platform-security
    describe: >-
      A flaw that needs a person at a terminal attached to the process: terminal
      escape sequences interpreted by a terminal emulator, readline and line
      editing, shell completion, pagers, interactive prompts and REPLs. Does NOT
      cover the same output when it is written to a log file, an HTTP response or
      another program.
    keywords: [TTY, "escape sequence", "ANSI escape", "terminal emulator", readline, "shell completion", "tab completion", pager, REPL]
    why: "в поде нет интерактивных сессий; у процесса нет терминала и человека за ним"
  - id: dev_tooling
    requires: no_dev_tooling_in_production
    describe: >-
      Tooling that runs on a developer's machine or in CI and never in a
      production pod: development servers (webpack-dev-server, the Vite dev
      server, PHP's built-in web server), hot module replacement, debug toolbars
      and profilers (the Symfony web profiler), Storybook, test runners and their
      helper endpoints (PHPUnit eval-stdin). Does NOT cover a flaw in the
      production build output or in the library's runtime API.
    keywords: ["dev server", "development server", "webpack-dev-server", "hot module replacement", HMR, "debug toolbar", "web profiler", "built-in web server", Storybook, PHPUnit, "eval-stdin"]
    why: "dev-серверы, отладочные панели и тест-раннеры в рабочих подах не запускаются"
  - id: malicious_backend
    requires: backends_are_trusted
    describe: >-
      A client library of a database, message broker, cache or object store
      attacked by the server it connects to: a malicious or compromised server
      sending crafted protocol responses. Does NOT cover an HTTP client that
      fetches a URL chosen by a user, a redirect to another host, or a registry
      or mirror on the public internet.
    keywords: ["malicious server", "rogue server", "attacker-controlled server", "compromised server", "untrusted server", "malicious database", "malicious broker"]
    why: "БД, брокеры и кэши находятся внутри кластера или управляются платформой; подставного сервера у клиента нет"

  # ---- Сетевые сервисы, которых в сервисах нет ---------------------------------
  - id: ftp_telnet
    requires: no_ftp_telnet_in_workloads
    describe: >-
      FTP, FTPS, TFTP and Telnet used by the service on either side: running
      such a server or connecting to one. Counts only when the protocol itself is
      the sole path to the flaw. An advisory that lists FTP among several
      affected transports ("HTTP, HTTPS and FTP") does NOT count.
    keywords: [FTP, FTPS, TFTP, Telnet]
    why: "FTP и Telnet в сервисах не используются ни как сервер, ни как клиент"
  - id: smb_nfs
    requires: no_smb_nfs_in_workloads
    describe: >-
      Network file sharing used by the service on either side: SMB, CIFS, Samba,
      NFS shares and their clients. Counts only when the file-sharing protocol is
      the sole path to the flaw.
    keywords: [SMB, CIFS, Samba, NFS]
    why: "сетевые файловые ресурсы SMB/NFS в сервисах не используются"
  - id: ldap
    requires: no_ldap_in_workloads
    describe: >-
      LDAP and NTLM used by the service on either side: a directory server
      (OpenLDAP, slapd, Active Directory) and client libraries that bind to one
      or authenticate with NTLM. Counts only when an LDAP or NTLM exchange is the
      sole path to the flaw.
    keywords: [LDAP, slapd, OpenLDAP, "Active Directory", NTLM]
    why: "LDAP и NTLM в сервисах не используются ни как сервер, ни как клиент"

  # ---- Фреймворки и продукты, на которых не написан ни один сервис --------------
  - id: angular
    requires: no_angular_in_projects
    describe: >-
      The Angular and AngularJS frameworks: their template compiler, sanitizer,
      router and server-side rendering. Counts only when Angular's own code is the
      sole path to the flaw.
    keywords: [Angular, AngularJS, "ng-template", "ngSanitize"]
    why: "ни один сервис не написан на Angular"
  - id: nextjs
    requires: no_nextjs_in_projects
    describe: >-
      The Next.js framework: its server, image optimisation, middleware, Server
      Actions, getServerSideProps and routing. Counts only when Next.js's own
      code is the sole path to the flaw.
    keywords: ["Next.js", "next/image", getServerSideProps, "Server Actions"]
    why: "ни один сервис не написан на Next.js"
  - id: svelte
    requires: no_svelte_in_projects
    describe: >-
      The Svelte compiler and runtime and the SvelteKit framework. Counts only
      when their own code is the sole path to the flaw.
    keywords: [Svelte, SvelteKit]
    why: "ни один сервис не написан на Svelte"
  - id: php_cms
    requires: no_php_cms_in_projects
    describe: >-
      PHP content-management systems and shops as products: WordPress, Drupal,
      Joomla, Magento, their plugins, themes and admin panels. Counts only when
      the product's own code is the sole path to the flaw. A general-purpose PHP
      library that such a product happens to use does NOT count.
    keywords: [WordPress, Drupal, Joomla, Magento]
    why: "ни один сервис не построен на PHP-CMS"
  - id: electron
    requires: no_electron_in_projects
    describe: >-
      The Electron desktop runtime: nodeIntegration, contextIsolation, the
      renderer and main process bridge, webview and protocol handlers.
    keywords: [Electron, nodeIntegration, contextIsolation]
    why: "сервисы — серверные приложения в подах, не десктопные программы на Electron"

# Правила сканеров, которые платформа закрывает по существу. Только те, где
# проверка буквально не о приложении. Каждая запись обязана назвать факт выше,
# на котором она держится, — иначе это просто список исключений.
platform_handles:
  - rule: "DS-0026"          # No HEALTHCHECK defined
    requires: liveness_probes_by_platform
    why: "живость контейнера проверяет kubelet через livenessProbe, HEALTHCHECK в образе не используется"
