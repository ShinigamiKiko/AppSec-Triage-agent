# PHP — phpactor. Для PHP это единственный путь к межфункциональному анализу:
# CodeQL язык не поддерживает и поддерживать не будет.
#
# Phpactor строит свой индекс и не требует composer install в целевом
# репозитории — в отличие от Psalm, которому нужен автозагрузчик проекта.
# Запускается как phar, потому что DNS в WSL не резолвит packagist: phar
# скачивается на хосте, где сеть есть, и исполняется интерпретатором Linux.
#
# Сервер живёт в WSL: на Windows-хосте нет ни php, ни composer. Конфигурация
# рассчитана на запуск агента ИЗ WSL — тогда и сервер, и триаж видят одну
# файловую систему, и path_map не нужен. Если запускать с Windows-хоста,
# потребуется обёртка и карта путей: сервер видит проект как /mnt/c/..., а этот
# процесс как C:\... Без трансляции каждый запрос называет путь, которого сервер
# не видит, и он молча не отвечает. Выглядит как «сервер не работает».
#   command: [wsl.exe, -d, Ubuntu, --, php, /mnt/c/.../phpactor.phar, language-server]
#   path_map: {"C:/": "/mnt/c/"}
command: [php, "${PHPACTOR_PHAR:-/opt/phpactor.phar}", language-server]
language_id: php
extensions: [".php"]
