# Semgrep. Нативной Windows-сборки не существует — на Windows пойдёт через Docker.
mode: native               # local CLI; avoids Windows PATH/Docker ambiguity
binary:
  - semgrep
image: semgrep/semgrep:latest

# p/default тянется из реестра, поэтому нужен сеть.
# Для закрытого контура: положи правила локально и укажи путь —
#   rules: ["/src/.semgrep"]  + docker_network: false
# Локальные правила из rules/semgrep — приоритетнее реестра и работают офлайн.
local_rules_dir: rules/semgrep
rules: ["p/default"]   # запасной вариант, если local_rules_dir убрать
docker_network: false

timeout_s: 1800
per_file_timeout_s: 30
