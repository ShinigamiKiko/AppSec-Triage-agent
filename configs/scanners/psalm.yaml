# Psalm taint-анализ — основной SAST для PHP.
#
# CodeQL PHP не поддерживает, поэтому для PHP это выбранный инструмент,
# отвечающий «доходит ли недоверенный ввод до стока», а не «похоже ли на
# опасный паттерн». В SARIF Psalm кладёт codeFlows — ingest предпочтёт эту
# запись любому менее информативному совпадению на том же месте (см. _richness).
#
# Если в целевом проекте нет psalm.xml или vendor/autoload.php, сканер создаёт
# временный минимальный конфиг вне проекта. Прямые и межфайловые PHP-потоки
# анализируются без скачивания проекта; framework-specific типы могут остаться
# неразрешёнными и это отражается в покрытии.
#
# На Symfony-проектах распознавание $request->get() как источника и Doctrine
# как стока зависит от моделей и плагинов проекта (например psalm/plugin-symfony).
# Нулевой результат не доказывает, что все framework-specific пути проверены.

mode: native                 # docker не предлагается: контейнер не видит vendor таргета
# Psalm ставится через composer global и обычно не на PATH.
binary:
  - psalm
  - /opt/composer/vendor/bin/psalm
  - ~/.config/composer/vendor/bin/psalm
image: null
language: php
run_in_target: true          # cwd = таргет: нужен для psalm.xml и автозагрузчика
timeout_s: 1800
docker_network: false
