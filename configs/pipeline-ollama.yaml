# Облегчённый профиль для локальной модели (Ollama). Только для неё.
#
# Выбирается сам при `-p ollama` без --config. С любым другим провайдером этот файл
# не принимается (ошибка), а callsite_* и skip_closure_audits сбрасываются к
# значениям по умолчанию, что бы ни стояло в файле: DeepSeek работает как раньше.
#
# Всё остальное — из pipeline.yaml: этот файл меняет только перечисленное ниже.
#
# Почему так: на прогоне 70 находок за 53 минуты время ушло на циклы инструментов
# в разборе цепочки (52–78% времени модели), а не на сам вердикт (15–26%).
extends: pipeline.yaml
provider: ollama

# Вопросов к анализатору и LSP на одну находку (по умолчанию 20).
max_tool_calls: 8
# Дочитываний контекста после первого вердикта (по умолчанию 2).
context_retrieval_rounds: 1
# Шаг «достигает ли ввод атакующего места вызова» в цепочке зависимости:
# раундов поиска (по умолчанию 3) и запросов потока данных к CodeQL (по умолчанию 4).
callsite_search_rounds: 1
callsite_dataflow_requests: 2

# Закрытия, которые принимаются без перепроверки моделью. Взяты только те, где
# перепроверка по всем прогонам ни разу не переоткрыла находку:
#   not_reached 38/0, not_shipped 34/0, wrong_receiver 5/0, test_only 1/0.
# Не пропускаются — там перепроверка ловила пропуски:
#   unused 159/50, no_input_path 26/5, only_in_tests 11/3.
# В отчёте такое закрытие помечено «принято без перепроверки моделью (профиль Ollama)».
skip_closure_audits: [not_reached, not_shipped, wrong_receiver, test_only]
